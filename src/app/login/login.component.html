<div class="login-wrapper">
  <div class="login-card">

    <div class="login-header">
      <div class="login-logo">T</div>
      <h1 class="login-title">TodoenUno</h1>
      <p class="login-subtitle">Inicia sesión en tu cuenta</p>
    </div>

    <div *ngIf="error" class="login-error" role="alert">
      {{ error }}
    </div>

    <form #loginForm="ngForm" (ngSubmit)="onSubmit()" novalidate>

      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="credenciales.email"
          required
          email
          #emailRef="ngModel"
          placeholder="correo@ejemplo.com"
          [class.input-error]="emailRef.invalid && emailRef.touched">
        <span *ngIf="emailRef.invalid && emailRef.touched" class="field-error">
          Ingresa un email válido.
        </span>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="credenciales.password"
          required
          minlength="6"
          #passwordRef="ngModel"
          placeholder="Tu contraseña"
          [class.input-error]="passwordRef.invalid && passwordRef.touched">
        <span *ngIf="passwordRef.invalid && passwordRef.touched" class="field-error">
          La contraseña es obligatoria.
        </span>
      </div>

      <button
        type="submit"
        class="login-btn"
        [disabled]="loginForm.invalid || cargando">
        <span *ngIf="cargando" class="spinner"></span>
        {{ cargando ? 'Ingresando...' : 'Iniciar sesión' }}
      </button>

    </form>

    <p class="login-footer">
      ¿No tienes cuenta? <a routerLink="/registro">Regístrate</a>
    </p>

  </div>
</div>
